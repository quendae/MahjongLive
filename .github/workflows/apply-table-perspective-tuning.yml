name: Apply table perspective tuning

on:
  push:
    branches:
      - ui/table-perspective-v18

permissions:
  contents: write

jobs:
  patch-table-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 3D table camera and tiles
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'client/src/table-3d.ts';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              "const TILE_FACE_OFFSET = .112;",
              "const TILE_FACE_OFFSET = .112;\nconst TILE_BACK_OFFSET = .118;\nconst OPPONENT_RACK_LEAN = .17;"
            ],
            [
              "  tileGeometry: any;\n  faceGeometry: any;\n  ivoryMaterial: any;",
              "  tileGeometry: any;\n  faceGeometry: any;\n  backGeometry: any;\n  ivoryMaterial: any;"
            ],
            [
              "    const spacing = .35;\n    // Opponent concealed tiles also stand upright. Pitch gives the long face its vertical height;\n    // yaw then turns that face toward the owner of the rack rather than toward the table centre.\n    transform.y = .34;\n    transform.pitch = Math.PI / 2;\n    transform.scale = .76;",
              "    const spacing = .39;\n    // Concealed racks lean slightly toward the table. From the player's lower camera angle this\n    // exposes the coloured backs together with a narrow ivory side, like a physical mahjong rack.\n    transform.y = .37;\n    transform.pitch = Math.PI / 2 + OPPONENT_RACK_LEAN;\n    transform.scale = .84;"
            ],
            [
              "  geometry.center();\n  return geometry;\n}\n\nfunction disposeFaceMaterials",
              "  geometry.center();\n  return geometry;\n}\n\nfunction roundedFaceGeometry(THREE: any, width: number, depth: number, radius: number): any {\n  const x0 = -width / 2;\n  const x1 = width / 2;\n  const y0 = -depth / 2;\n  const y1 = depth / 2;\n  const shape = new THREE.Shape();\n  shape.moveTo(x0 + radius, y0);\n  shape.lineTo(x1 - radius, y0);\n  shape.quadraticCurveTo(x1, y0, x1, y0 + radius);\n  shape.lineTo(x1, y1 - radius);\n  shape.quadraticCurveTo(x1, y1, x1 - radius, y1);\n  shape.lineTo(x0 + radius, y1);\n  shape.quadraticCurveTo(x0, y1, x0, y1 - radius);\n  shape.lineTo(x0, y0 + radius);\n  shape.quadraticCurveTo(x0, y0, x0 + radius, y0);\n  return new THREE.ShapeGeometry(shape, 8);\n}\n\nfunction disposeFaceMaterials"
            ],
            [
              "  const rear = new THREE.Mesh(rt.faceGeometry, rt.backMaterial);\n  rear.position.y = -TILE_FACE_OFFSET;",
              "  const rear = new THREE.Mesh(rt.backGeometry, rt.backMaterial);\n  rear.position.y = -TILE_BACK_OFFSET;"
            ],
            [
              "  const camera = new THREE.PerspectiveCamera(37, 1, .1, 60);\n  camera.position.set(0, 10.15, 11.55);\n  camera.lookAt(0, .08, .20);",
              "  const camera = new THREE.PerspectiveCamera(34, 1, .1, 60);\n  camera.position.set(0, 7.75, 12.75);\n  camera.lookAt(0, .25, .15);"
            ],
            [
              "  const tileGeometry = roundedTileGeometry(THREE);\n  const faceGeometry = new THREE.PlaneGeometry(.37, .51);\n  const ivoryMaterial = new THREE.MeshStandardMaterial({\n    color: 0xe9dfc8,",
              "  const tileGeometry = roundedTileGeometry(THREE);\n  const faceGeometry = roundedFaceGeometry(THREE, .39, .53, .038);\n  // The back cap deliberately reaches over the bevel so the green back reads as one continuous\n  // piece instead of a small sticker floating inside a cream border.\n  const backGeometry = roundedFaceGeometry(THREE, .438, .578, .052);\n  const ivoryMaterial = new THREE.MeshStandardMaterial({\n    color: 0xf7f1df,"
            ],
            [
              "  const backMaterial = new THREE.MeshStandardMaterial({ map: backTexture, roughness: .65, metalness: 0 });",
              "  const backMaterial = new THREE.MeshStandardMaterial({ map: backTexture, roughness: .58, metalness: 0 });"
            ],
            [
              "    tileGeometry,\n    faceGeometry,\n    ivoryMaterial,",
              "    tileGeometry,\n    faceGeometry,\n    backGeometry,\n    ivoryMaterial,"
            ],
            [
              "  rt.tileGeometry.dispose();\n  rt.faceGeometry.dispose();\n  rt.ivoryMaterial.dispose();",
              "  rt.tileGeometry.dispose();\n  rt.faceGeometry.dispose();\n  rt.backGeometry.dispose();\n  rt.ivoryMaterial.dispose();"
            ]
          ];

          let changed = false;
          for (const [before, after] of replacements) {
            if (source.includes(after)) continue;
            if (!source.includes(before)) {
              throw new Error(`Expected source block not found:\n${before}`);
            }
            source = source.replace(before, after);
            changed = true;
          }

          if (changed) fs.writeFileSync(path, source);
          NODE

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- client/src/table-3d.ts; then
            echo "table-3d.ts already tuned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/table-3d.ts
          git commit -m "Tune 3D camera and concealed tile backs"
          git push
