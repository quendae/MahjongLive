name: One-shot source edit

on:
  push:
    branches:
      - feature/visual-table-replay
    paths:
      - '.source-edit-trigger'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-table-replay
      - name: Apply meld layout fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/table-3d.ts')
          text = path.read_text(encoding='utf-8')
          old = """    const meldIndex = Math.max(0, spec.meldIndex ?? 0);\n    const tileIndex = Math.max(0, spec.meldTileIndex ?? spec.index);\n    // Keep each legal 3/4-tile meld as one group. The previous flat 8-column stream wrapped the\n    // ninth tile onto a second row, which could throw a perfectly legal third meld into the table.\n    const groupGap = tuning.tiles.meldRowGap;\n    const groupStride = Math.max(1.18, gap * 4 + groupGap);\n    const linear = meldIndex * groupStride + tileIndex * gap;\n"""
          new = """    const meldIndex = Math.max(0, spec.meldIndex ?? 0);\n    // Use the authoritative flat index so a triplet consumes three slots and a Kan four.\n    // meldRowGap is the desired centre-to-centre spacing at a group boundary; subtract the\n    // normal tile gap here so existing Dev values remain intuitive and useful.\n    const groupBoundaryGap = Math.max(0, tuning.tiles.meldRowGap - gap);\n    const linear = spec.index * gap + meldIndex * groupBoundaryGap;\n"""
          if old not in text:
              raise SystemExit('Expected meld layout source block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.source-edit-trigger').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-source-edit.yml').unlink(missing_ok=True)
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: compact 3d meld groups by actual size'
          git push origin HEAD:feature/visual-table-replay
