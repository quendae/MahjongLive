name: Apply UX performance pass

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-ux-performance-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply UX/performance changes
        run: python scripts/apply-ux-performance-pass.py
      - name: Typecheck client
        run: pnpm client:typecheck
      - name: Build client
        run: pnpm client:build
      - name: Commit directly to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/table-3d-faces.ts client/src/main.ts client/src/style.css client/src/ux.css client/src/dev-tuning.ts client/src/clarity.css client/src/table-3d.css client/src/table-3d.ts
          git commit -m "Polish calls, Riichi UX and performance simulation"
          git push
