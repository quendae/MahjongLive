name: Apply performance observability patch

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/patch-performance-observability.mjs'
      - '.github/workflows/agent-patch-performance-observability.yml'

permissions:
  contents: write

jobs:
  patch-head-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate patcher syntax
        run: node --check scripts/patch-performance-observability.mjs
      - name: Apply exact source patch
        run: node scripts/patch-performance-observability.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit performance observability
        run: |
          if git diff --quiet -- client/src/table-3d.ts client/src/dev-tuning.ts; then
            echo 'Performance observability already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/table-3d.ts client/src/dev-tuning.ts
          git commit -m 'feat: expose 120hz performance bottleneck metrics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
