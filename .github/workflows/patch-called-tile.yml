name: One-shot called tile patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-called-tile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source-aware called tile gaps
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected block not found in ${path}:\n${before}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          }

          const fieldsBefore = `    calledTileRotation: number;\n    calledTileGap: number;`;
          const fieldsAfter = `    calledTileRotation: number;\n    calledTileGap: number;\n    calledTileGapFromLeft: number;\n    calledTileGapAcross: number;\n    calledTileGapFromRight: number;`;

          const defaultsBefore = `    calledTileRotation: 90,\n    calledTileGap: .10,`;
          const defaultsAfter = `    calledTileRotation: 90,\n    calledTileGap: .10,\n    calledTileGapFromLeft: .10,\n    calledTileGapAcross: .10,\n    calledTileGapFromRight: .10,`;

          const readBeforeTable = `      calledTileRotation: finiteNumber(raw.tiles?.calledTileRotation, DEFAULT_DEV_TUNING.tiles.calledTileRotation),\n      calledTileGap: finiteNumber(raw.tiles?.calledTileGap, DEFAULT_DEV_TUNING.tiles.calledTileGap),`;
          const readAfterTable = `      calledTileRotation: finiteNumber(raw.tiles?.calledTileRotation, DEFAULT_DEV_TUNING.tiles.calledTileRotation),\n      calledTileGap: finiteNumber(raw.tiles?.calledTileGap, DEFAULT_DEV_TUNING.tiles.calledTileGap),\n      calledTileGapFromLeft: finiteNumber(raw.tiles?.calledTileGapFromLeft, finiteNumber(raw.tiles?.calledTileGap, DEFAULT_DEV_TUNING.tiles.calledTileGapFromLeft)),\n      calledTileGapAcross: finiteNumber(raw.tiles?.calledTileGapAcross, finiteNumber(raw.tiles?.calledTileGap, DEFAULT_DEV_TUNING.tiles.calledTileGapAcross)),\n      calledTileGapFromRight: finiteNumber(raw.tiles?.calledTileGapFromRight, finiteNumber(raw.tiles?.calledTileGap, DEFAULT_DEV_TUNING.tiles.calledTileGapFromRight)),`;

          const transformBefore = `      const extra = tuning.tiles.calledTileGap;\n      if (spec.side === 'bottom') transform.x += extra;\n      else if (spec.side === 'top') transform.x -= extra;\n      else if (spec.side === 'left') transform.z += extra;\n      else transform.z -= extra;`;
          const transformAfter = `      const owner = Number(spec.player);\n      const source = spec.calledFrom;\n      let extra = tuning.tiles.calledTileGap;\n      if (Number.isFinite(owner) && typeof source === 'number' && Number.isFinite(source)) {\n        const relativeSource = (source - owner + 4) % 4;\n        if (relativeSource === 1) extra = tuning.tiles.calledTileGapFromRight;\n        else if (relativeSource === 2) extra = tuning.tiles.calledTileGapAcross;\n        else if (relativeSource === 3) extra = tuning.tiles.calledTileGapFromLeft;\n      }\n      if (spec.side === 'bottom') transform.x += extra;\n      else if (spec.side === 'top') transform.x -= extra;\n      else if (spec.side === 'left') transform.z += extra;\n      else transform.z -= extra;`;

          replaceExact('client/src/table-3d.ts', fieldsBefore, fieldsAfter);
          replaceExact('client/src/table-3d.ts', defaultsBefore, defaultsAfter);
          replaceExact('client/src/table-3d.ts', readBeforeTable, readAfterTable);
          replaceExact('client/src/table-3d.ts', transformBefore, transformAfter);

          const readBeforeDev = `      calledTileRotation: finite(raw.tiles?.calledTileRotation, DEFAULTS.tiles.calledTileRotation),\n      calledTileGap: finite(raw.tiles?.calledTileGap, DEFAULTS.tiles.calledTileGap),`;
          const readAfterDev = `      calledTileRotation: finite(raw.tiles?.calledTileRotation, DEFAULTS.tiles.calledTileRotation),\n      calledTileGap: finite(raw.tiles?.calledTileGap, DEFAULTS.tiles.calledTileGap),\n      calledTileGapFromLeft: finite(raw.tiles?.calledTileGapFromLeft, finite(raw.tiles?.calledTileGap, DEFAULTS.tiles.calledTileGapFromLeft)),\n      calledTileGapAcross: finite(raw.tiles?.calledTileGapAcross, finite(raw.tiles?.calledTileGap, DEFAULTS.tiles.calledTileGapAcross)),\n      calledTileGapFromRight: finite(raw.tiles?.calledTileGapFromRight, finite(raw.tiles?.calledTileGap, DEFAULTS.tiles.calledTileGapFromRight)),`;
          replaceExact('client/src/dev-tuning.ts', fieldsBefore, fieldsAfter);
          replaceExact('client/src/dev-tuning.ts', defaultsBefore, defaultsAfter);
          replaceExact('client/src/dev-tuning.ts', readBeforeDev, readAfterDev);
          replaceExact(
            'client/src/dev-tuning.ts',
            `  numberSlider(tileSection, 'Called tile gap', -.30, .30, .01, () => settings.tiles.calledTileGap, (v) => { settings.tiles.calledTileGap = v; }, '', DEFAULTS.tiles.calledTileGap);`,
            `  numberSlider(tileSection, 'Called tile gap · fallback', -.30, .30, .01, () => settings.tiles.calledTileGap, (v) => { settings.tiles.calledTileGap = v; }, '', DEFAULTS.tiles.calledTileGap);`,
          );
          NODE
      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/table-3d.ts client/src/dev-tuning.ts
          git diff --cached --check
          git commit -m "feat: separate called tile spacing by source"
          git push origin HEAD:master
