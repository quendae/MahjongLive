name: Apply 3D runtime audit patch

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/patch-3d-runtime-audit.mjs'
      - '.github/workflows/agent-patch-3d-runtime.yml'

permissions:
  contents: write

jobs:
  patch-head-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patch
        run: node scripts/patch-3d-runtime-audit.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit patched runtime
        run: |
          if git diff --quiet -- client/src/table-3d.ts; then
            echo 'Runtime already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/table-3d.ts
          git commit -m 'fix: audit 3d motion and refresh hover shadows'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
