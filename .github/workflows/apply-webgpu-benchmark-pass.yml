name: Apply WebGPU benchmark pass

on:
  push:
    paths:
      - 'scripts/apply-webgpu-benchmark-pass.py'
      - '.github/workflows/apply-webgpu-benchmark-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply WebGPU benchmark pass
        run: python scripts/apply-webgpu-benchmark-pass.py
      - name: Typecheck client
        run: pnpm client:typecheck
      - name: Build client
        run: pnpm client:build
      - name: Commit directly to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/table-3d.ts client/src/dev-tuning.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Add WebGPU renderer option and benchmark sweep'
          git push origin HEAD:master
