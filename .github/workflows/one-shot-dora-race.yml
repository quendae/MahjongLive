name: One-shot Dora race fix

on:
  push:
    branches:
      - feature/visual-table-replay
    paths:
      - '.dora-race-trigger'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-table-replay
      - name: Preserve Dora tray during transient table rerender
        shell: python
        run: |
          from pathlib import Path

          path = Path('client/src/clarity.ts')
          text = path.read_text(encoding='utf-8')
          old = """  if (!table.classList.contains('table-3d-active')) {
    source.classList.remove('clarity-source-hidden');
    source.classList.add('center-dora-integrated');
    tableTray?.remove();
    stageTray?.remove();
    return;
  }
"""
          new = """  if (!table.classList.contains('table-3d-active')) {
    source.classList.remove('clarity-source-hidden');
    source.classList.add('center-dora-integrated');
    tableTray?.remove();
    // The authoritative #app rerender creates a fresh table before table-3d.ts can re-attach
    // table-3d-active. While the stable 3D stage is still active, that is only a transient frame —
    // keep its Dora tray mounted instead of flashing it out and recreating it one observer later.
    if (!stage?.classList.contains('is-active')) stageTray?.remove();
    return;
  }
"""
          if old not in text:
              raise SystemExit('Expected Dora 2D/3D branch not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.dora-race-trigger').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-dora-race.yml').unlink(missing_ok=True)
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve dora tray across transient rerenders'
          git push origin HEAD:feature/visual-table-replay
