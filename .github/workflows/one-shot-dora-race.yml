name: One-shot Dora race fix

on:
  push:
    branches:
      - feature/visual-table-replay
    paths:
      - '.dora-race-trigger'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-table-replay
      - name: Preserve Dora tray during transient table rerender
        shell: python
        run: |
          from pathlib import Path
          path = Path('client/src/clarity.ts')
          text = path.read_text(encoding='utf-8')
          old = '    stageTray?.remove();'
          new = "    if (!stage?.classList.contains('is-active')) stageTray?.remove();"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Dora tray removal, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.dora-race-trigger').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-dora-race.yml').unlink(missing_ok=True)
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve dora tray across transient rerenders'
          git push origin HEAD:feature/visual-table-replay
