name: Apply Riichi table-state patch

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/patch-riichi-table-state.mjs'
      - '.github/workflows/agent-patch-riichi-table-state.yml'

permissions:
  contents: write

jobs:
  patch-head-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patch
        run: node scripts/patch-riichi-table-state.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit table-state presentation
        run: |
          if git diff --quiet -- client/src/clarity.ts client/src/clarity.css; then
            echo 'Table-state presentation already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/clarity.ts client/src/clarity.css
          git commit -m 'feat: add classic riichi table-state display'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
