name: Import riichi SVG tile faces

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-riichi-svg-assets.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import public-domain SVG artwork
        run: python scripts/import-riichi-svg-assets.py
      - name: Typecheck client
        run: pnpm client:typecheck
      - name: Build client
        run: pnpm client:build
      - name: Commit imported assets and renderer integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/tiles/riichi-regular client/src/table-3d.ts
          git commit -m "Use FluffyStuff public-domain SVG tile faces"
          git push
