name: One-shot WebGL fallback state fix

on:
  push:
    branches:
      - feature/visual-table-replay
    paths:
      - '.webgl-fallback-fix-trigger'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-table-replay
      - name: Mark failed WebGL startup as an error state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/table-3d.ts')
          text = path.read_text(encoding='utf-8')
          old = "      console.warn('Mahjong Live 3D renderer unavailable; keeping 2D table.', error);\n      fallbackNote"
          new = "      console.warn('Mahjong Live 3D renderer unavailable; keeping 2D table.', error);\n      loadError = true;\n      fallbackNote"
          if old not in text:
              raise SystemExit('Expected WebGL fallback anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.webgl-fallback-fix-trigger').unlink(missing_ok=True)
          Path('.github/workflows/one-shot-webgl-fallback-fix.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: expose failed WebGL startup as unavailable'
          git push origin HEAD:feature/visual-table-replay
