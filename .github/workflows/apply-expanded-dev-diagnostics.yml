name: Apply expanded 3D diagnostic controls

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-expanded-dev-diagnostics.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Expand diagnostic controls
        run: node scripts/expand-dev-diagnostics.mjs

      - name: Typecheck client
        run: pnpm client:typecheck

      - name: Build client
        run: pnpm client:build

      - name: Commit directly to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/dev-tuning.ts client/src/dev-tuning.css client/src/table-3d.ts client/src/table-3d.css
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Expand 3D developer diagnostics'
          git push origin HEAD:master
