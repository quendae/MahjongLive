name: Apply 3D table diagnostics fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-3d-table-diagnostics-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove obsolete face-file UV patch target
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/fix-3d-table-diagnostics.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const startNeedle = `  text = replaceOnce(\n    text,\n    "  return new THREE.ShapeGeometry(shape, 8);\\n}",`;
          const start = text.indexOf(startNeedle);
          if (start < 0) throw new Error('obsolete UV block start not found');
          const endNeedle = `    'normalized rounded face UVs',\n  );\n`;
          const end = text.indexOf(endNeedle, start);
          if (end < 0) throw new Error('obsolete UV block end not found');
          text = text.slice(0, start) + text.slice(end + endNeedle.length);
          fs.writeFileSync(path, text);
          NODE
      - name: Apply rendering and diagnostic changes
        run: node scripts/fix-3d-table-diagnostics.mjs
      - name: Typecheck client
        run: pnpm client:typecheck
      - name: Build client
        run: pnpm client:build
      - name: Commit directly to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/table-3d.ts client/src/table-3d-faces.ts client/src/table-3d.css client/src/dev-tuning.ts
          git commit -m "Fix 3D tile fronts and table diagnostics"
          git push
