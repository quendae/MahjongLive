name: Shared engine CI

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'server/**'
      - 'client/**'
      - 'scripts/**'
      - 'START_GAME.bat'
      - 'start-game.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/shared-ci.yml'
  push:
    branches: [master]
    paths:
      - 'shared/**'
      - 'server/**'
      - 'client/**'
      - 'scripts/**'
      - 'START_GAME.bat'
      - 'start-game.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/shared-ci.yml'

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/start.mjs
      - run: node --check scripts/bot-benchmark.mjs
      - run: pnpm bot:benchmark -- --help
      - run: pnpm --filter @mahjong-live/shared typecheck
      - run: pnpm --filter @mahjong-live/shared test
      - run: pnpm --filter @mahjong-live/server typecheck
      - run: pnpm --filter @mahjong-live/server test
      - run: pnpm bot:benchmark -- --seeds 20260916 --rotations 0 --max-rounds 48 --max-actions 1600
      - run: pnpm client:typecheck
      - run: pnpm client:build
