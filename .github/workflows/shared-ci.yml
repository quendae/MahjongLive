name: Shared engine CI

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/shared-ci.yml'
  push:
    branches: [master]
    paths:
      - 'shared/**'
      - 'client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/shared-ci.yml'

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mahjong-live/shared typecheck
      - run: pnpm --filter @mahjong-live/shared test
      - run: pnpm client:typecheck
      - run: pnpm client:build
