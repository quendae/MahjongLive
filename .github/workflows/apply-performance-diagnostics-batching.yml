name: Apply performance diagnostics and batching

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-performance-diagnostics-batching.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply performance changes
        run: python scripts/apply-performance-diagnostics-batching.py
      - name: Typecheck client
        run: pnpm client:typecheck
      - name: Build client
        run: pnpm client:build
      - name: Commit directly to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/table-3d.ts client/src/dev-tuning.ts client/src/dev-tuning.css
          git commit -m "Add RAF GPU diagnostics and batch static discards"
          git push
