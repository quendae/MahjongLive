name: Apply developer tuning controls

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-dev-tuning-menu.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add dev tuning menu and renderer controls
        shell: bash
        run: |
          cat > client/src/dev-tuning.css <<'EOF'
          .dev-tuning-toggle {
            border-color: rgba(232, 201, 112, .28) !important;
            color: #ead495 !important;
          }

          .dev-tuning-panel {
            position: fixed;
            z-index: 80;
            top: 58px;
            right: 12px;
            width: min(430px, calc(100vw - 24px));
            max-height: calc(100vh - 72px);
            overflow: auto;
            padding: 14px;
            border: 1px solid rgba(232, 201, 112, .28);
            border-radius: 14px;
            color: #e9eee9;
            background: rgba(5, 15, 10, .97);
            box-shadow: 0 24px 70px rgba(0,0,0,.48);
            font: 12px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
            backdrop-filter: blur(10px);
          }

          .dev-tuning-panel[hidden] { display: none; }
          .dev-tuning-panel * { box-sizing: border-box; }
          .dev-tuning-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
          .dev-tuning-head strong { font-size: 14px; letter-spacing: .03em; }
          .dev-tuning-head span { margin-left: auto; color: #8da99a; font-size: 10px; }
          .dev-tuning-close,
          .dev-tuning-action {
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;
            padding: 6px 9px;
            color: #e9eee9;
            background: rgba(255,255,255,.06);
            cursor: pointer;
          }
          .dev-tuning-close { padding: 4px 8px; }
          .dev-tuning-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); }
          .dev-tuning-section h3 { margin: 0 0 8px; color: #d8c17e; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
          .dev-tuning-control { display: grid; grid-template-columns: 88px minmax(0, 1fr) 58px; gap: 8px; align-items: center; margin: 5px 0; }
          .dev-tuning-control label { color: #afc0b7; }
          .dev-tuning-control input[type='range'] { width: 100%; accent-color: #d7bd72; }
          .dev-tuning-control output { text-align: right; color: #f0e5c4; font-variant-numeric: tabular-nums; }
          .dev-tuning-color { display: grid; grid-template-columns: 88px 42px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; margin: 7px 0; }
          .dev-tuning-color > label { color: #afc0b7; }
          .dev-tuning-color input[type='color'] { width: 42px; height: 30px; padding: 1px; border: 1px solid rgba(255,255,255,.12); border-radius: 6px; background: transparent; }
          .dev-tuning-color input[type='number'] { width: 100%; min-width: 0; padding: 5px; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; color: #e8ede9; background: rgba(255,255,255,.045); }
          .dev-tuning-file { display: grid; grid-template-columns: 88px 1fr auto; gap: 7px; align-items: center; margin: 7px 0; }
          .dev-tuning-file label { color: #afc0b7; }
          .dev-tuning-file input[type='file'] { min-width: 0; color: #aabbb2; font-size: 10px; }
          .dev-tuning-presets { display: grid; grid-template-columns: 88px 1fr; gap: 7px; align-items: center; margin: 7px 0; }
          .dev-tuning-presets label { color: #afc0b7; }
          .dev-tuning-presets select { width: 100%; padding: 6px; border: 1px solid rgba(255,255,255,.1); border-radius: 6px; color: #e8ede9; background: #102019; }
          .dev-tuning-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
          .dev-tuning-status { min-height: 16px; margin-top: 8px; color: #8fa99b; font-size: 10px; }
          .dev-tuning-note { margin: 6px 0 0; color: #80988b; font-size: 10px; }

          @media (max-width: 720px) {
            .dev-tuning-panel { top: 8px; right: 8px; max-height: calc(100vh - 16px); width: calc(100vw - 16px); }
            .dev-tuning-control { grid-template-columns: 78px minmax(0, 1fr) 52px; }
          }
          EOF

          cat > client/src/dev-tuning.ts <<'EOF'
          import './dev-tuning.css';

          const STORAGE_KEY = 'mahjong-live:dev-tuning:v1';
          const EVENT_NAME = 'mahjong-live:dev-tuning';

          type Rotation = { x: number; y: number; z: number };
          type CameraSettings = { x: number; y: number; z: number; targetX: number; targetY: number; targetZ: number; fov: number };
          type DevTuning = {
            camera: CameraSettings;
            left: Rotation;
            right: Rotation;
            bottom: Rotation;
            tableColor: string;
            tableImage: string | null;
            backColor: string;
          };

          const DEFAULTS: DevTuning = {
            camera: { x: 0, y: 7.75, z: 12.75, targetX: 0, targetY: .25, targetZ: .15, fov: 34 },
            left: { x: -90, y: 0, z: -90 },
            right: { x: -90, y: 0, z: 90 },
            bottom: { x: 90, y: 0, z: 0 },
            tableColor: '#174a36',
            tableImage: null,
            backColor: '#315c49',
          };

          function finite(value: unknown, fallback: number): number {
            return typeof value === 'number' && Number.isFinite(value) ? value : fallback;
          }

          function rotation(value: any, fallback: Rotation): Rotation {
            return {
              x: finite(value?.x, fallback.x),
              y: finite(value?.y, fallback.y),
              z: finite(value?.z, fallback.z),
            };
          }

          function loadSettings(): DevTuning {
            let raw: any = {};
            try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '{}'); } catch { raw = {}; }
            return {
              camera: {
                x: finite(raw.camera?.x, DEFAULTS.camera.x),
                y: finite(raw.camera?.y, DEFAULTS.camera.y),
                z: finite(raw.camera?.z, DEFAULTS.camera.z),
                targetX: finite(raw.camera?.targetX, DEFAULTS.camera.targetX),
                targetY: finite(raw.camera?.targetY, DEFAULTS.camera.targetY),
                targetZ: finite(raw.camera?.targetZ, DEFAULTS.camera.targetZ),
                fov: finite(raw.camera?.fov, DEFAULTS.camera.fov),
              },
              left: rotation(raw.left, DEFAULTS.left),
              right: rotation(raw.right, DEFAULTS.right),
              bottom: rotation(raw.bottom, DEFAULTS.bottom),
              tableColor: typeof raw.tableColor === 'string' ? raw.tableColor : DEFAULTS.tableColor,
              tableImage: typeof raw.tableImage === 'string' ? raw.tableImage : null,
              backColor: typeof raw.backColor === 'string' ? raw.backColor : DEFAULTS.backColor,
            };
          }

          let settings = loadSettings();
          let panel: HTMLElement | null = null;

          function saveAndBroadcast(message = ''): void {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
            } catch {
              setStatus('Could not persist settings — the uploaded image may be too large.');
            }
            applyDomPreview();
            window.dispatchEvent(new CustomEvent(EVENT_NAME, { detail: settings }));
            if (message) setStatus(message);
          }

          function setStatus(text: string): void {
            const status = panel?.querySelector<HTMLElement>('.dev-tuning-status');
            if (status) status.textContent = text;
          }

          function applyDomPreview(): void {
            document.querySelectorAll<HTMLElement>('.mahjong-table').forEach((table) => {
              table.style.backgroundColor = settings.tableColor;
              table.style.backgroundImage = settings.tableImage ? `url("${settings.tableImage}")` : 'none';
              table.style.backgroundSize = settings.tableImage ? 'cover' : '';
              table.style.backgroundPosition = settings.tableImage ? 'center' : '';
            });
            document.querySelectorAll<HTMLElement>('.tile-back').forEach((tile) => {
              tile.style.background = settings.backColor;
            });
          }

          function numberSlider(
            parent: HTMLElement,
            label: string,
            min: number,
            max: number,
            step: number,
            get: () => number,
            set: (value: number) => void,
            suffix = '',
          ): void {
            const row = document.createElement('div');
            row.className = 'dev-tuning-control';
            const name = document.createElement('label');
            name.textContent = label;
            const input = document.createElement('input');
            input.type = 'range';
            input.min = String(min);
            input.max = String(max);
            input.step = String(step);
            input.value = String(get());
            const out = document.createElement('output');
            const render = () => { out.textContent = `${Number(input.value).toFixed(step < 1 ? 2 : 0)}${suffix}`; };
            render();
            input.addEventListener('input', () => {
              set(Number(input.value));
              render();
              saveAndBroadcast();
            });
            row.append(name, input, out);
            parent.append(row);
          }

          function hexToRgb(hex: string): [number, number, number] {
            const value = hex.replace('#', '').padEnd(6, '0').slice(0, 6);
            return [0, 2, 4].map((offset) => Number.parseInt(value.slice(offset, offset + 2), 16) || 0) as [number, number, number];
          }

          function rgbToHex(r: number, g: number, b: number): string {
            const part = (value: number) => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0');
            return `#${part(r)}${part(g)}${part(b)}`;
          }

          function colorControl(parent: HTMLElement, label: string, get: () => string, set: (value: string) => void): void {
            const row = document.createElement('div');
            row.className = 'dev-tuning-color';
            const name = document.createElement('label');
            name.textContent = label;
            const picker = document.createElement('input');
            picker.type = 'color';
            picker.value = get();
            const nums = [0, 1, 2].map(() => {
              const input = document.createElement('input');
              input.type = 'number'; input.min = '0'; input.max = '255'; input.step = '1';
              return input;
            });
            const syncNums = () => {
              const rgb = hexToRgb(picker.value);
              nums.forEach((input, index) => { input.value = String(rgb[index]); });
            };
            syncNums();
            picker.addEventListener('input', () => {
              set(picker.value);
              syncNums();
              saveAndBroadcast();
            });
            nums.forEach((input) => input.addEventListener('input', () => {
              const color = rgbToHex(Number(nums[0].value), Number(nums[1].value), Number(nums[2].value));
              picker.value = color;
              set(color);
              saveAndBroadcast();
            }));
            row.append(name, picker, ...nums);
            parent.append(row);
          }

          function rotationSection(parent: HTMLElement, title: string, target: Rotation): void {
            const section = document.createElement('section');
            section.className = 'dev-tuning-section';
            section.innerHTML = `<h3>${title}</h3>`;
            numberSlider(section, 'Rotate X', -180, 180, 1, () => target.x, (v) => { target.x = v; }, '°');
            numberSlider(section, 'Rotate Y', -180, 180, 1, () => target.y, (v) => { target.y = v; }, '°');
            numberSlider(section, 'Rotate Z', -180, 180, 1, () => target.z, (v) => { target.z = v; }, '°');
            parent.append(section);
          }

          function buildPanel(): HTMLElement {
            const root = document.createElement('aside');
            root.className = 'dev-tuning-panel';
            root.hidden = true;
            root.innerHTML = `
              <div class="dev-tuning-head">
                <strong>3D Dev Tuning</strong>
                <span>F2</span>
                <button type="button" class="dev-tuning-close">×</button>
              </div>
            `;

            const camera = document.createElement('section');
            camera.className = 'dev-tuning-section';
            camera.innerHTML = '<h3>Camera</h3>';
            numberSlider(camera, 'Position X', -20, 20, .05, () => settings.camera.x, (v) => { settings.camera.x = v; });
            numberSlider(camera, 'Position Y', .5, 20, .05, () => settings.camera.y, (v) => { settings.camera.y = v; });
            numberSlider(camera, 'Position Z', -20, 25, .05, () => settings.camera.z, (v) => { settings.camera.z = v; });
            numberSlider(camera, 'Target X', -6, 6, .05, () => settings.camera.targetX, (v) => { settings.camera.targetX = v; });
            numberSlider(camera, 'Target Y', -2, 5, .05, () => settings.camera.targetY, (v) => { settings.camera.targetY = v; });
            numberSlider(camera, 'Target Z', -6, 6, .05, () => settings.camera.targetZ, (v) => { settings.camera.targetZ = v; });
            numberSlider(camera, 'FOV', 20, 70, 1, () => settings.camera.fov, (v) => { settings.camera.fov = v; }, '°');
            root.append(camera);

            rotationSection(root, 'Left opponent tiles', settings.left);
            rotationSection(root, 'Right opponent tiles', settings.right);
            rotationSection(root, 'Your tiles', settings.bottom);

            const surfaces = document.createElement('section');
            surfaces.className = 'dev-tuning-section';
            surfaces.innerHTML = '<h3>Table & tile backs</h3>';
            colorControl(surfaces, 'Table RGB', () => settings.tableColor, (v) => { settings.tableColor = v; });

            const fileRow = document.createElement('div');
            fileRow.className = 'dev-tuning-file';
            const fileLabel = document.createElement('label');
            fileLabel.textContent = 'Table image';
            const file = document.createElement('input');
            file.type = 'file'; file.accept = 'image/*';
            const clear = document.createElement('button');
            clear.type = 'button'; clear.className = 'dev-tuning-action'; clear.textContent = 'Clear';
            file.addEventListener('change', () => {
              const selected = file.files?.[0];
              if (!selected) return;
              if (selected.size > 3_000_000) {
                setStatus('Image is over 3 MB. Use a smaller texture for localStorage.');
                file.value = '';
                return;
              }
              const reader = new FileReader();
              reader.onload = () => {
                settings.tableImage = typeof reader.result === 'string' ? reader.result : null;
                saveAndBroadcast(`Loaded ${selected.name}`);
              };
              reader.readAsDataURL(selected);
            });
            clear.addEventListener('click', () => {
              settings.tableImage = null;
              file.value = '';
              saveAndBroadcast('Table image cleared.');
            });
            fileRow.append(fileLabel, file, clear);
            surfaces.append(fileRow);

            const presetRow = document.createElement('div');
            presetRow.className = 'dev-tuning-presets';
            const presetLabel = document.createElement('label'); presetLabel.textContent = 'Back preset';
            const preset = document.createElement('select');
            const presets: [string, string][] = [
              ['Custom RGB', ''], ['Jade', '#315c49'], ['Mint', '#31b77b'], ['Teal', '#246f74'],
              ['Blue', '#315f91'], ['Burgundy', '#7d3445'], ['Black', '#252a27'], ['Ivory', '#d8cfb6'],
            ];
            presets.forEach(([name, value]) => {
              const option = document.createElement('option'); option.textContent = name; option.value = value; preset.append(option);
            });
            preset.addEventListener('change', () => {
              if (!preset.value) return;
              settings.backColor = preset.value;
              saveAndBroadcast(`Back preset: ${preset.selectedOptions[0]?.textContent ?? ''}`);
              root.remove(); panel = buildPanel(); document.body.append(panel); panel.hidden = false;
            });
            presetRow.append(presetLabel, preset);
            surfaces.append(presetRow);
            colorControl(surfaces, 'Back RGB', () => settings.backColor, (v) => { settings.backColor = v; preset.value = ''; });
            surfaces.insertAdjacentHTML('beforeend', '<p class="dev-tuning-note">The colored back is a physical cap around the rear face; the pattern itself stays slightly inset.</p>');
            root.append(surfaces);

            const actions = document.createElement('div');
            actions.className = 'dev-tuning-actions';
            const reset = document.createElement('button');
            reset.type = 'button'; reset.className = 'dev-tuning-action'; reset.textContent = 'Reset defaults';
            reset.addEventListener('click', () => {
              settings = structuredClone(DEFAULTS);
              localStorage.removeItem(STORAGE_KEY);
              saveAndBroadcast('Defaults restored.');
              root.remove(); panel = buildPanel(); document.body.append(panel); panel.hidden = false;
            });
            const copy = document.createElement('button');
            copy.type = 'button'; copy.className = 'dev-tuning-action'; copy.textContent = 'Copy JSON';
            copy.addEventListener('click', async () => {
              await navigator.clipboard?.writeText(JSON.stringify(settings, null, 2));
              setStatus('Settings JSON copied.');
            });
            actions.append(reset, copy);
            root.append(actions);
            const status = document.createElement('div'); status.className = 'dev-tuning-status'; root.append(status);
            root.querySelector<HTMLButtonElement>('.dev-tuning-close')?.addEventListener('click', () => { root.hidden = true; });
            return root;
          }

          function ensureUi(): void {
            const actions = document.querySelector<HTMLElement>('.header-actions');
            if (!actions) return;
            if (!panel) { panel = buildPanel(); document.body.append(panel); }
            if (!actions.querySelector('.dev-tuning-toggle')) {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'header-button dev-tuning-toggle';
              button.textContent = 'Dev';
              button.title = 'Open 3D camera/tile tuning (F2)';
              button.addEventListener('click', () => { if (panel) panel.hidden = !panel.hidden; });
              actions.append(button);
            }
            applyDomPreview();
          }

          const observer = new MutationObserver(ensureUi);
          observer.observe(document.body, { childList: true, subtree: true });
          window.addEventListener('keydown', (event) => {
            if (event.key !== 'F2') return;
            event.preventDefault();
            ensureUi();
            if (panel) panel.hidden = !panel.hidden;
          });
          ensureUi();
          saveAndBroadcast();
          EOF

          node <<'NODE'
          const fs = require('fs');
          const path = 'client/src/table-3d.ts';
          let s = fs.readFileSync(path, 'utf8');
          const replace = (before, after, name) => {
            if (s.includes(after)) return;
            if (!s.includes(before)) throw new Error(`Missing block: ${name}`);
            s = s.replace(before, after);
          };

          replace(
            "const TILE_BACK_OFFSET = .118;\nconst OPPONENT_RACK_LEAN = .17;",
            `const TILE_BACK_OFFSET = .124;\nconst OPPONENT_RACK_LEAN = .17;\nconst DEV_TUNING_KEY = 'mahjong-live:dev-tuning:v1';\n\ntype DevRotation = { x: number; y: number; z: number };\ntype DevTuning = {\n  camera: { x: number; y: number; z: number; targetX: number; targetY: number; targetZ: number; fov: number };\n  left: DevRotation;\n  right: DevRotation;\n  bottom: DevRotation;\n  tableColor: string;\n  tableImage: string | null;\n  backColor: string;\n};\n\nconst DEFAULT_DEV_TUNING: DevTuning = {\n  camera: { x: 0, y: 7.75, z: 12.75, targetX: 0, targetY: .25, targetZ: .15, fov: 34 },\n  left: { x: -90, y: 0, z: -90 },\n  right: { x: -90, y: 0, z: 90 },\n  bottom: { x: 90, y: 0, z: 0 },\n  tableColor: '#174a36',\n  tableImage: null,\n  backColor: '#315c49',\n};`,
            'dev constants',
          );

          replace(
            "  rear: any;\n  indicator: any;",
            "  rear: any;\n  rearShell: any;\n  indicator: any;",
            'rear shell actor field',
          );

          replace(
            "  backGeometry: any;\n  ivoryMaterial: any;\n  backMaterial: any;",
            "  backGeometry: any;\n  backShellGeometry: any;\n  ivoryMaterial: any;\n  feltMaterial: any;\n  backMaterial: any;\n  backShellMaterial: any;\n  tableTexture: any | null;\n  tableTextureSource: string | null;",
            'runtime surface fields',
          );

          replace(
            "function readFaceMode(): TileFaceMode {\n  return localStorage.getItem(TILE_MODE_KEY) === 'beginner' ? 'beginner' : 'classic';\n}\n",
            `function readFaceMode(): TileFaceMode {\n  return localStorage.getItem(TILE_MODE_KEY) === 'beginner' ? 'beginner' : 'classic';\n}\n\nfunction finiteNumber(value: unknown, fallback: number): number {\n  return typeof value === 'number' && Number.isFinite(value) ? value : fallback;\n}\n\nfunction readDevTuning(): DevTuning {\n  let raw: any = {};\n  try { raw = JSON.parse(localStorage.getItem(DEV_TUNING_KEY) ?? '{}'); } catch { raw = {}; }\n  const readRotation = (value: any, fallback: DevRotation): DevRotation => ({\n    x: finiteNumber(value?.x, fallback.x),\n    y: finiteNumber(value?.y, fallback.y),\n    z: finiteNumber(value?.z, fallback.z),\n  });\n  return {\n    camera: {\n      x: finiteNumber(raw.camera?.x, DEFAULT_DEV_TUNING.camera.x),\n      y: finiteNumber(raw.camera?.y, DEFAULT_DEV_TUNING.camera.y),\n      z: finiteNumber(raw.camera?.z, DEFAULT_DEV_TUNING.camera.z),\n      targetX: finiteNumber(raw.camera?.targetX, DEFAULT_DEV_TUNING.camera.targetX),\n      targetY: finiteNumber(raw.camera?.targetY, DEFAULT_DEV_TUNING.camera.targetY),\n      targetZ: finiteNumber(raw.camera?.targetZ, DEFAULT_DEV_TUNING.camera.targetZ),\n      fov: finiteNumber(raw.camera?.fov, DEFAULT_DEV_TUNING.camera.fov),\n    },\n    left: readRotation(raw.left, DEFAULT_DEV_TUNING.left),\n    right: readRotation(raw.right, DEFAULT_DEV_TUNING.right),\n    bottom: readRotation(raw.bottom, DEFAULT_DEV_TUNING.bottom),\n    tableColor: typeof raw.tableColor === 'string' ? raw.tableColor : DEFAULT_DEV_TUNING.tableColor,\n    tableImage: typeof raw.tableImage === 'string' ? raw.tableImage : null,\n    backColor: typeof raw.backColor === 'string' ? raw.backColor : DEFAULT_DEV_TUNING.backColor,\n  };\n}\n\nfunction radians(degrees: number): number {\n  return degrees * Math.PI / 180;\n}\n\nfunction setConfiguredRotation(transform: Transform, rotation: DevRotation): void {\n  transform.pitch = radians(rotation.x);\n  transform.yaw = radians(rotation.y);\n  transform.roll = radians(rotation.z);\n}\n`,
            'dev reader functions',
          );

          replace(
            "    transform.y = .42;\n    transform.pitch = Math.PI / 2;\n    transform.scale = 1.03;",
            "    transform.y = .42;\n    setConfiguredRotation(transform, readDevTuning().bottom);\n    transform.scale = 1.03;",
            'bottom rack rotation',
          );

          replace(
            `    // Concealed racks lean slightly toward the table. From the player's lower camera angle this\n    // exposes the coloured backs together with a narrow ivory side, like a physical mahjong rack.\n    transform.y = .37;\n    transform.pitch = Math.PI / 2 + OPPONENT_RACK_LEAN;\n    transform.scale = .84;\n    if (spec.side === 'top') {\n      transform.x = centered * spacing;\n      transform.z = -4.08;\n      transform.yaw = Math.PI;\n    } else if (spec.side === 'left') {\n      transform.x = -5.10;\n      transform.z = centered * spacing;\n      transform.yaw = -Math.PI / 2;\n    } else {\n      transform.x = 5.10;\n      transform.z = -centered * spacing;\n      transform.yaw = Math.PI / 2;\n    }`,
            `    transform.y = .37;\n    transform.scale = .84;\n    const tuning = readDevTuning();\n    if (spec.side === 'top') {\n      transform.x = centered * spacing;\n      transform.z = -4.08;\n      transform.pitch = Math.PI / 2 + OPPONENT_RACK_LEAN;\n      transform.yaw = Math.PI;\n    } else if (spec.side === 'left') {\n      transform.x = -5.10;\n      transform.z = centered * spacing;\n      setConfiguredRotation(transform, tuning.left);\n    } else {\n      transform.x = 5.10;\n      transform.z = -centered * spacing;\n      setConfiguredRotation(transform, tuning.right);\n    }`,
            'opponent rack rotations',
          );

          replace(
            "  } else if (spec.zone === 'hand') {\n    position = .004;\n    yaw = .006;\n    tilt = .002;\n  } else {\n    position = .005;\n    yaw = .008;\n    tilt = .0025;\n  }",
            "  } else if (spec.zone === 'hand') {\n    position = .004;\n    yaw = 0;\n    tilt = 0;\n  } else {\n    position = .002;\n    yaw = 0;\n    tilt = 0;\n  }",
            'stable rack rotations',
          );

          replace(
            "function roundedFaceGeometry(THREE: any, width: number, depth: number, radius: number): any {",
            `function roundedBackShellGeometry(THREE: any): any {\n  const width = .448;\n  const depth = .588;\n  const height = .040;\n  const radius = .058;\n  const x0 = -width / 2;\n  const x1 = width / 2;\n  const y0 = -depth / 2;\n  const y1 = depth / 2;\n  const shape = new THREE.Shape();\n  shape.moveTo(x0 + radius, y0);\n  shape.lineTo(x1 - radius, y0);\n  shape.quadraticCurveTo(x1, y0, x1, y0 + radius);\n  shape.lineTo(x1, y1 - radius);\n  shape.quadraticCurveTo(x1, y1, x1 - radius, y1);\n  shape.lineTo(x0 + radius, y1);\n  shape.quadraticCurveTo(x0, y1, x0, y1 - radius);\n  shape.lineTo(x0, y0 + radius);\n  shape.quadraticCurveTo(x0, y0, x0 + radius, y0);\n  const geometry = new THREE.ExtrudeGeometry(shape, {\n    depth: height, steps: 1, curveSegments: 6, bevelEnabled: true,\n    bevelSegments: 2, bevelSize: .009, bevelThickness: .009,\n  });\n  geometry.rotateX(-Math.PI / 2);\n  geometry.center();\n  return geometry;\n}\n\nfunction roundedFaceGeometry(THREE: any, width: number, depth: number, radius: number): any {`,
            'back shell geometry',
          );

          replace(
            "  visual.add(body);\n\n  const face = new THREE.Mesh(rt.faceGeometry, materialForFace(rt, spec.label, spec.back));",
            `  visual.add(body);\n\n  // A shallow coloured cap overlaps the body bevel. The printed back stays inset, while the\n  // back colour itself wraps onto the side/top/bottom edges like a real two-piece mahjong tile.\n  const rearShell = new THREE.Mesh(rt.backShellGeometry, rt.backShellMaterial);\n  rearShell.position.y = -.103;\n  rearShell.castShadow = true;\n  rearShell.receiveShadow = true;\n  visual.add(rearShell);\n\n  const face = new THREE.Mesh(rt.faceGeometry, materialForFace(rt, spec.label, spec.back));`,
            'back shell mesh',
          );

          replace(
            "    rear,\n    indicator,",
            "    rear,\n    rearShell,\n    indicator,",
            'actor shell assignment',
          );

          replace(
            "  actor.rear.userData.actorKey = actor.key;",
            "  actor.rear.userData.actorKey = actor.key;\n  actor.rearShell.userData.actorKey = actor.key;",
            'actor shell tag',
          );

          replace(
            "      if (rt.initialized && drawJustOccurred && rt.drawOrigin && (spec.zone === 'hand' || spec.zone === 'rack')) {\n        initial = { ...rt.drawOrigin };\n      } else if (rt.initialized && spec.zone === 'river' && spec.side !== 'bottom') {",
            "      // Until a visible wall exists, new draws appear directly in the receiving hand.\n      // This avoids tiles flying in from another player's rack / the synthetic wall origin.\n      if (rt.initialized && spec.zone === 'river' && spec.side !== 'bottom') {",
            'draw origin behavior',
          );

          replace(
            "  const camera = new THREE.PerspectiveCamera(34, 1, .1, 60);\n  camera.position.set(0, 7.75, 12.75);\n  camera.lookAt(0, .25, .15);",
            "  const tuning = readDevTuning();\n  const camera = new THREE.PerspectiveCamera(tuning.camera.fov, 1, .1, 60);\n  camera.position.set(tuning.camera.x, tuning.camera.y, tuning.camera.z);\n  camera.lookAt(tuning.camera.targetX, tuning.camera.targetY, tuning.camera.targetZ);",
            'camera defaults',
          );

          replace(
            `  const felt = new THREE.Mesh(\n    new THREE.BoxGeometry(11.48, .18, 9.08),\n    new THREE.MeshStandardMaterial({ color: 0x174a36, roughness: .96, metalness: 0 }),\n  );`,
            `  const feltMaterial = new THREE.MeshStandardMaterial({\n    color: tuning.tableImage ? 0xffffff : tuning.tableColor,\n    roughness: .96,\n    metalness: 0,\n  });\n  const felt = new THREE.Mesh(\n    new THREE.BoxGeometry(11.48, .18, 9.08),\n    feltMaterial,\n  );`,
            'felt material',
          );

          replace(
            `  const faceGeometry = roundedFaceGeometry(THREE, .39, .53, .038);\n  // The back cap deliberately reaches over the bevel so the green back reads as one continuous\n  // piece instead of a small sticker floating inside a cream border.\n  const backGeometry = roundedFaceGeometry(THREE, .438, .578, .052);`,
            `  const faceGeometry = roundedFaceGeometry(THREE, .39, .53, .038);\n  // Pattern is intentionally inset; the separate 3D shell provides the coloured edge spill.\n  const backGeometry = roundedFaceGeometry(THREE, .405, .545, .043);\n  const backShellGeometry = roundedBackShellGeometry(THREE);`,
            'back geometries',
          );

          replace(
            "  const backMaterial = new THREE.MeshStandardMaterial({ map: backTexture, roughness: .58, metalness: 0 });",
            `  const backMaterial = new THREE.MeshStandardMaterial({\n    map: backTexture, color: tuning.backColor, roughness: .58, metalness: 0,\n  });\n  const backShellMaterial = new THREE.MeshStandardMaterial({\n    color: tuning.backColor, roughness: .58, metalness: 0,\n  });`,
            'back materials',
          );

          replace(
            "    backGeometry,\n    ivoryMaterial,\n    backMaterial,",
            "    backGeometry,\n    backShellGeometry,\n    ivoryMaterial,\n    feltMaterial,\n    backMaterial,\n    backShellMaterial,\n    tableTexture: null,\n    tableTextureSource: null,",
            'runtime surface assignments',
          );

          replace(
            "  renderer.setAnimationLoop((time: number) => frameRuntime(rt, time));\n  return rt;",
            `  applyDevTuning(rt);\n  renderer.setAnimationLoop((time: number) => frameRuntime(rt, time));\n  return rt;`,
            'initial dev tuning',
          );

          replace(
            "function frameRuntime(rt: TableRuntime, time: number): void {",
            `function syncTableTexture(rt: TableRuntime, source: string | null): void {\n  if (source === rt.tableTextureSource) return;\n  rt.tableTextureSource = source;\n  rt.tableTexture?.dispose?.();\n  rt.tableTexture = null;\n  rt.feltMaterial.map = null;\n  rt.feltMaterial.needsUpdate = true;\n  if (!source) return;\n  new rt.THREE.TextureLoader().load(source, (texture: any) => {\n    if (rt.disposed || rt.tableTextureSource !== source) { texture.dispose(); return; }\n    texture.colorSpace = rt.THREE.SRGBColorSpace;\n    rt.tableTexture = texture;\n    rt.feltMaterial.map = texture;\n    rt.feltMaterial.color.set(0xffffff);\n    rt.feltMaterial.needsUpdate = true;\n  }, undefined, () => {\n    if (rt.tableTextureSource === source) {\n      rt.tableTextureSource = null;\n      rt.feltMaterial.map = null;\n      rt.feltMaterial.color.set(readDevTuning().tableColor);\n      rt.feltMaterial.needsUpdate = true;\n    }\n  });\n}\n\nfunction applyDevTuning(rt: TableRuntime): void {\n  const tuning = readDevTuning();\n  rt.camera.fov = tuning.camera.fov;\n  rt.camera.position.set(tuning.camera.x, tuning.camera.y, tuning.camera.z);\n  rt.camera.lookAt(tuning.camera.targetX, tuning.camera.targetY, tuning.camera.targetZ);\n  rt.camera.updateProjectionMatrix();\n  rt.backMaterial.color.set(tuning.backColor);\n  rt.backShellMaterial.color.set(tuning.backColor);\n  rt.feltMaterial.color.set(tuning.tableImage ? 0xffffff : tuning.tableColor);\n  syncTableTexture(rt, tuning.tableImage);\n}\n\nfunction frameRuntime(rt: TableRuntime, time: number): void {`,
            'runtime tuning functions',
          );

          replace(
            "  rt.backGeometry.dispose();\n  rt.ivoryMaterial.dispose();",
            "  rt.backGeometry.dispose();\n  rt.backShellGeometry.dispose();\n  rt.ivoryMaterial.dispose();\n  rt.feltMaterial.dispose();\n  rt.backShellMaterial.dispose();\n  rt.tableTexture?.dispose?.();",
            'surface disposal',
          );

          replace(
            "  removeFallbackNote(table);\n  alignStage(rt, table);",
            "  removeFallbackNote(table);\n  applyDevTuning(rt);\n  alignStage(rt, table);",
            'reconcile tuning',
          );

          replace(
            "window.addEventListener('mahjong-live:tile-face-mode', scheduleReconcile);",
            "window.addEventListener('mahjong-live:tile-face-mode', scheduleReconcile);\nwindow.addEventListener('mahjong-live:dev-tuning', scheduleReconcile);",
            'dev event listener',
          );

          fs.writeFileSync(path, s);

          const faces = 'client/src/table-3d-faces.ts';
          let f = fs.readFileSync(faces, 'utf8');
          f = f.replace("ctx.fillStyle = back ? '#315c49' : '#f7f1df';", "ctx.fillStyle = back ? '#ffffff' : '#f7f1df';");
          f = f.replace("ctx.strokeStyle = back ? '#8fb39f' : '#c8bea9';", "ctx.strokeStyle = back ? 'rgba(28,54,43,.52)' : '#c8bea9';");
          f = f.replace("ctx.strokeStyle = 'rgba(232,244,236,.34)';", "ctx.strokeStyle = 'rgba(29,59,46,.28)';");
          fs.writeFileSync(faces, f);

          const index = 'client/index.html';
          let html = fs.readFileSync(index, 'utf8');
          const line = '    <script type="module" src="/src/dev-tuning.ts"></script>\n';
          if (!html.includes(line)) html = html.replace('    <script type="module" src="/src/table-3d.ts"></script>\n', line + '    <script type="module" src="/src/table-3d.ts"></script>\n');
          fs.writeFileSync(index, html);
          NODE

          rm .github/workflows/apply-dev-tuning-menu.yml

      - name: Typecheck and build
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm client:typecheck
          pnpm client:build

      - name: Commit directly to master
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/dev-tuning.ts client/src/dev-tuning.css client/src/table-3d.ts client/src/table-3d-faces.ts client/index.html .github/workflows/apply-dev-tuning-menu.yml
          git commit -m "Add 3D developer tuning menu"
          git push origin HEAD:master
