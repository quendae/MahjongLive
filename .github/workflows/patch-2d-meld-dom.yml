name: One-shot 2D meld DOM patch

on:
  push:
    branches: [master]
    paths:
      - 'scripts/patch-meld-dom.py'
      - '.github/workflows/patch-2d-meld-dom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move meld rows out of transformed player cards
        run: python scripts/patch-meld-dom.py
      - name: Commit DOM restructuring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/main.ts
          git diff --cached --check
          git commit -m "fix: anchor meld rows to player zones"
          git push origin HEAD:master
