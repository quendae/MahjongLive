name: Apply Riichi discard engine patch

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/patch-riichi-discard-engine.mjs'
      - '.github/workflows/agent-patch-riichi-discard-engine.yml'

permissions:
  contents: write

jobs:
  patch-head-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patch
        run: node scripts/patch-riichi-discard-engine.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit engine marker
        run: |
          if git diff --quiet -- shared/src/engine/rules/types.ts shared/src/engine/rules/round.ts; then
            echo 'Riichi discard engine marker already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/src/engine/rules/types.ts shared/src/engine/rules/round.ts
          git commit -m 'feat: persist riichi declaration discard marker'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
