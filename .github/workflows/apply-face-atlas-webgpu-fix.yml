name: Apply face atlas and WebGPU fix

on:
  push:
    paths:
      - 'scripts/apply-face-atlas-webgpu-fix.py'
      - '.github/workflows/apply-face-atlas-webgpu-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply face atlas and WebGPU fix
        run: python scripts/apply-face-atlas-webgpu-fix.py
      - name: Typecheck client
        run: pnpm client:typecheck
      - name: Build client
        run: pnpm client:build
      - name: Commit directly to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/table-3d.ts client/src/dev-tuning.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Use one tile face atlas and initialize WebGPU explicitly'
          git push origin HEAD:master
