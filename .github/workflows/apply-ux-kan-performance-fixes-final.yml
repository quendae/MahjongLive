name: Apply final UX, Kan and renderer fixes

on:
  push:
    paths:
      - 'scripts/apply-ux-kan-final-fixes.py'
      - '.github/workflows/apply-ux-kan-performance-fixes-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply feature patch
        run: python scripts/apply-ux-kan-performance-fixes.py
      - name: Update rule-policy tests
        run: python scripts/apply-ux-kan-test-updates.py
      - name: Apply final test and layout corrections
        run: python scripts/apply-ux-kan-final-fixes.py
      - name: Full check
        run: pnpm check
      - name: Commit directly to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/table-3d.ts client/src/main.ts client/src/enhance.ts client/src/ux.css client/src/dev-tuning.ts shared/src/engine/rules/kan.ts shared/src/engine/rules/kanTiming.test.ts shared/src/engine/rules/kan.test.ts shared/src/engine/rules/chankan.test.ts docs/ROADMAP.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Fix renderer tuning, Kan timing and table UX'
          git push origin HEAD:master
