name: Apply claim choice integration patch

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/patch-claim-choice-ux.mjs'
      - '.github/workflows/agent-patch-claim-choice-ux.yml'

permissions:
  contents: write

jobs:
  patch-head-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source patch
        run: node scripts/patch-claim-choice-ux.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit patched UI
        run: |
          if git diff --quiet -- client/src/main.ts; then
            echo 'Claim choice UI already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/main.ts
          git commit -m 'feat: improve claim choice presentation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
